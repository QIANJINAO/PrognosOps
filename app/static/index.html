<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrognosOps 维策 · 设备运维工作台</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <!-- S09:新页面只使用 tokens/components/layout,禁止新增 Tailwind 工具类 -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <!-- S19:状态动效(淡入/spinner/应用高亮/reduced-motion) -->
  <link rel="stylesheet" href="/static/css/motion.css">
  <!-- S20:Chart.js 4.4.2 本地提供(取消未固定 CDN 引用,版本与许可证见 vendor/VENDOR-LICENSES.md) -->
  <script src="/static/vendor/chart.umd.min.js" defer></script>
</head>
<body class="po-app">

  <!-- 登录态守卫:无令牌时立即跳转登录页(同步执行,避免工作台闪烁) -->
  <script>
    (function () {
      try {
        var token = localStorage.getItem('po_auth_token');
        if (!token) {
          window.location.replace('/login');
        }
      } catch (e) {
        window.location.replace('/login');
      }
    })();
  </script>

  <!-- ═══════════════ 顶栏(精简:侧栏开关/品牌/服务状态/演示模式) ═══════════════ -->
  <header class="po-topbar">
    <div class="po-topbar-inner">
      <button class="po-sidebar-toggle" id="po-sidebar-toggle" type="button" aria-label="折叠或展开侧栏" title="折叠/展开侧栏">
        <span class="po-sidebar-toggle-icon" aria-hidden="true"></span>
      </button>
      <div class="po-brand-group">
        <span class="po-brand-mark" aria-hidden="true"></span>
        <span class="po-brand">PrognosOps</span>
        <span class="po-brand-sub">维策 Agent</span>
      </div>
      <div class="po-health">
        <span class="po-health-dot" id="po-health-dot"></span>
        <span id="po-health-text">检测中</span>
      </div>
      <!-- 登录用户区(登录后显示:用户名 + 登出按钮) -->
      <div class="po-user-area" id="po-user-area" hidden>
        <span class="po-user-name" id="po-user-name"></span>
        <button class="po-logout-btn" id="po-logout-btn" type="button" title="退出登录">登出</button>
      </div>
      <button class="po-demo-toggle" id="po-demo-toggle" type="button" title="切换大屏演示模式(放大关键信息,底部显示演示流程导航)">演示模式</button>
    </div>
  </header>

  <!-- ═══════════════ 应用壳:可折叠侧栏 + 会话主体 ═══════════════ -->
  <div class="po-app-shell" id="po-app-shell">

    <!-- ───────── 左侧轻量侧栏(品牌/导航/数据入口/运行记录) ───────── -->
    <aside class="po-sidebar" id="po-sidebar">
      <div class="po-sidebar-head">
        <span class="po-brand-mark" aria-hidden="true"></span>
        <span class="po-sidebar-brand-text">维策 Agent</span>
      </div>
      <nav class="po-sidebar-nav" id="po-sidebar-nav" aria-label="主导航">
        <button class="po-sidebar-link is-active" data-route="chat" type="button">
          <span class="po-sidebar-link-icon" aria-hidden="true">💬</span>对话
        </button>
        <button class="po-sidebar-link" data-route="data" type="button">
          <span class="po-sidebar-link-icon" aria-hidden="true">📊</span>数据与质量
        </button>
        <button class="po-sidebar-link" data-route="validation" type="button">
          <span class="po-sidebar-link-icon" aria-hidden="true">🔬</span>回测验证
        </button>
      </nav>
      <div class="po-sidebar-section">
        <h3 class="po-sidebar-section-title">数据入口</h3>
        <button class="po-sidebar-action" id="sidebar-import-btn" type="button">导入 CSV 文件</button>
        <button class="po-sidebar-action" id="sidebar-demo-btn" type="button">加载演示数据</button>
      </div>
      <div class="po-sidebar-context" id="po-sidebar-context">
        <div class="po-sidebar-ctx-row"><span class="po-ctx-label">数据集</span><span class="po-ctx-value" id="ctx-dataset">未导入</span></div>
        <div class="po-sidebar-ctx-row"><span class="po-ctx-label">设备</span><span class="po-ctx-value" id="ctx-unit">—</span></div>
        <div class="po-sidebar-ctx-row"><span class="po-ctx-label">当前方案</span><span class="po-ctx-value" id="ctx-scenario">未应用</span></div>
      </div>
      <div class="po-sidebar-footer">
        <button class="po-sidebar-action" id="sidebar-runs-btn" type="button">运行记录</button>
      </div>
    </aside>

    <!-- ───────── 主体内容区 ───────── -->
    <main class="po-main" id="po-main">

      <!-- 会话(默认页面,AI 对话主体) -->
      <section class="po-page po-page-chat" data-route="chat" id="page-chat"></section>

      <!-- 数据与质量(侧栏辅助页) -->
      <section class="po-page" data-route="data" id="page-data" hidden></section>

      <!-- 回测验证(侧栏辅助页) -->
      <section class="po-page" data-route="validation" id="page-validation" hidden></section>

    </main>
  </div>

  <!-- 详情抽屉挂载点(查看分析图表/方案对比/质量详情,按需打开) -->
  <div id="detail-drawer-root"></div>

  <!-- S17:运行记录抽屉挂载点(fixed 定位,不依赖页面容器) -->
  <div id="run-history-root"></div>

  <!-- ═══════════════ 大屏演示导航(演示模式开启时显示,5 步业务闭环引导) ═══════════════ -->
  <div class="po-demo-nav" id="po-demo-nav" hidden>
    <div class="po-demo-nav-inner">
      <span class="po-demo-nav-title">演示流程</span>
      <button class="po-demo-step" type="button" data-route="data">① 加载数据</button>
      <span class="po-demo-arrow">→</span>
      <button class="po-demo-step" type="button" data-route="chat">② 分析设备</button>
      <span class="po-demo-arrow">→</span>
      <button class="po-demo-step" type="button" data-route="chat" data-scroll="concl">③ 解释决策</button>
      <span class="po-demo-arrow">→</span>
      <button class="po-demo-step" type="button" data-route="chat" data-scroll="candidates">④ 对比情景</button>
      <span class="po-demo-arrow">→</span>
      <button class="po-demo-step" type="button" data-route="validation">⑤ 验证方案</button>
    </div>
  </div>

  <!-- 脚本:状态层 + 控制器 + 路由 + 引导(不加载 app.js,不同时挂新旧 DOM;
       S14 起加载 charts.js:图表工具模块,新旧页共用,非旧页 DOM 逻辑) -->
  <script src="/static/js/state.js"></script>
  <script src="/static/js/request-controller.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/charts.js"></script>
  <script src="/static/js/parameters.js"></script>
  <script src="/static/js/controllers/analysis.js"></script>
  <script src="/static/js/controllers/agent.js"></script>
  <script src="/static/js/controllers/backtest.js"></script>
  <script src="/static/js/demo-data.js"></script>
  <script src="/static/js/views/data-view.js"></script>
  <script src="/static/js/components/run-timeline.js"></script>
  <script src="/static/js/components/scenario-panel.js"></script>
  <script src="/static/js/components/result-table.js"></script>
  <script src="/static/js/components/evidence-panel.js"></script>
  <script src="/static/js/components/artifact-list.js"></script>
  <script src="/static/js/components/run-history.js"></script>
  <script src="/static/js/export.js"></script>
  <script src="/static/js/components/detail-drawer.js"></script>
  <script src="/static/js/views/cards.js"></script>
  <script src="/static/js/views/chat-view.js"></script>
  <script src="/static/js/views/backtest-view.js"></script>
  <script src="/static/js/router.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/bootstrap.js"></script>
</body>
</html>
