# Render 部署配置(免费层)
# 文档:https://render.com/docs/blueprint-spec
services:
  - type: web
    name: prognosops
    runtime: python
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0   # 写完整的三段版本号
      # 以下为敏感/可选变量,需在 Render 控制台手动填写(sync: false 不入库)
      - key: MODEL_BASE_URL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        sync: false
