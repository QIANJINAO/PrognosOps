# Render 部署配置(免费层)
# 文档:https://render.com/docs/blueprint-spec
services:
  - type: web
    name: prognosops
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        # 与本地已通过测试的版本一致，满足 NumPy 2.5 的 Python >=3.12 要求
        value: 3.14.4
      # 以下为敏感/可选变量,需在 Render 控制台手动填写(sync: false 不入库)
      - key: MODEL_BASE_URL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        sync: false
